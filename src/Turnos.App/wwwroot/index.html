<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Turnos — Kinesiología</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.min.css" />
    <link rel="stylesheet" href="Turnos.App.styles.css" />
    <link rel="icon" href="data:,">
    <script>
        // El tema guardado vive en Preferences de MAUI (EstadoApp.Tema); esta copia en
        // localStorage solo sirve para pintar el primer frame con el tema correcto.
        window.turnosTema = {
            aplicar: function (tema) {
                document.documentElement.dataset.tema = tema;
                try { localStorage.setItem("tema", tema); } catch (e) { }
            }
        };
        try { document.documentElement.dataset.tema = localStorage.getItem("tema") || "dia"; } catch (e) { }
    </script>
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        Ocurrió un error inesperado.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
