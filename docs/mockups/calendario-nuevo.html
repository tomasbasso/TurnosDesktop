<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agenda — mockup</title>
<style>
:root {
  --tinta: #211c18; --panel: #2b2420; --papel: #f4ebda; --vino: #b0524a; --arena: #b9a98c; --brasa: #caa25a; --salvia: #9db08f;
  --serif: Constantia, Georgia, "Times New Roman", serif;
  --sans: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: #e9e4dc; font-family: var(--sans); color: #292524; padding: 20px 16px 40px; }
.switch { display: flex; gap: 12px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
.seg { display: inline-flex; background: #fff; border: 1px solid #d6d0c6; border-radius: 10px; padding: 3px; }
.seg button { font: inherit; font-size: 13px; border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; cursor: pointer; color: #57534e; }
.seg button[aria-pressed="true"] { background: #211c18; color: #f4ebda; }
.seg button:focus-visible { outline: 2px solid #caa25a; outline-offset: 2px; }
.frame { max-width: 1180px; margin: 0 auto; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(33,28,24,.55), 0 0 0 1px rgba(33,28,24,.12); }

/* ---------- PROPUESTA ---------- */
.nuevo { --fondo: #1c1815; --col: #231e1a; --col-pasado: #1d1916; --linea: rgba(244,235,218,.06); --linea-media: rgba(244,235,218,.03);
  --tarjeta: #352c27; --tarjeta-borde: rgba(202,162,90,.22); --hecho: #28221e; --texto: #f4ebda; --texto-2: #b9a98c; --texto-3: #8a7c68;
  --acento: #caa25a; --vino-txt: #d98c83; --toolbar: #211c18; --velo: rgba(12,9,7,.32);
  background: var(--fondo); color: var(--texto); }
.nuevo.dia { --fondo: #efe7da; --col: #fbf7f0; --col-pasado: #f3ece1; --linea: rgba(33,28,24,.09); --linea-media: rgba(33,28,24,.04);
  --tarjeta: #ffffff; --tarjeta-borde: rgba(33,28,24,.14); --hecho: #f1e9dc; --texto: #211c18; --texto-2: #6f6253; --texto-3: #9a8b76;
  --acento: #a07a2c; --vino-txt: #9a3f38; --toolbar: #fbf7f0; --velo: rgba(120,100,80,.07); }

.nuevo .barra { display: flex; align-items: center; gap: 18px; padding: 16px 22px; background: var(--toolbar); border-bottom: 1px solid var(--linea); }
.nuevo .nav { display: flex; align-items: center; gap: 2px; border: 1px solid var(--tarjeta-borde); border-radius: 10px; padding: 2px; }
.nuevo .nav button { font: inherit; background: transparent; border: 0; color: var(--texto-2); height: 30px; min-width: 30px; border-radius: 7px; cursor: pointer; font-size: 15px; }
.nuevo .nav button.hoy { font-size: 12px; letter-spacing: .08em; padding: 0 10px; color: var(--texto); }
.nuevo .nav button:hover { background: var(--linea); color: var(--texto); }
.nuevo .eyebrow { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--vino); font-weight: 600; }
.nuevo.dia .eyebrow { color: #9a3f38; }
.nuevo .titulo { font-family: var(--serif); font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.nuevo .titulo em { font-style: normal; color: var(--texto-2); font-weight: 400; }
.nuevo .resumen { margin-left: auto; display: flex; align-items: center; gap: 18px; font-size: 12px; color: var(--texto-2); }
.nuevo .resumen b { color: var(--texto); font-weight: 600; font-variant-numeric: tabular-nums; }
.nuevo kbd { font-family: var(--sans); font-size: 10px; border: 1px solid var(--tarjeta-borde); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--texto-2); }
.nuevo .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-size: 14px; background: var(--panel); color: var(--papel); border: 1px solid rgba(202,162,90,.55); }

.nuevo .cab { display: grid; grid-template-columns: 64px repeat(6, minmax(0,1fr)); border-bottom: 1px solid var(--linea); background: var(--toolbar); }
.nuevo .cab-dia { padding: 10px 12px 12px; border-left: 1px solid var(--linea); display: flex; align-items: flex-end; gap: 10px; }
.nuevo .cab-dia .dn { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--texto-3); }
.nuevo .cab-dia .num { font-family: var(--serif); font-size: 26px; line-height: 1; font-variant-numeric: lining-nums; }
.nuevo .cab-dia.pasado .num { color: var(--texto-3); }
.nuevo .cab-dia.hoy .num { color: var(--acento); }
.nuevo .cab-dia .info { margin-left: auto; text-align: right; font-size: 11px; color: var(--texto-2); }
.nuevo .densidad { height: 3px; width: 54px; border-radius: 2px; background: var(--linea); margin-top: 5px; overflow: hidden; margin-left: auto; }
.nuevo .densidad i { display: block; height: 100%; background: var(--acento); border-radius: 2px; }
.nuevo .cab-dia.pasado .densidad i { background: var(--texto-3); }

.cuerpo { position: relative; display: grid; grid-template-columns: 64px repeat(6, minmax(0,1fr)); }
.nuevo .canal { position: relative; }
.nuevo .canal span { position: absolute; right: 10px; font-size: 11px; color: var(--texto-3); font-variant-numeric: tabular-nums; transform: translateY(-50%); }
.nuevo .dia-col { position: relative; border-left: 1px solid var(--linea); background-color: var(--col); cursor: cell;
  background-image: linear-gradient(var(--linea) 1px, transparent 1px), linear-gradient(var(--linea-media) 1px, transparent 1px);
  background-size: 100% 72px, 100% 36px; }
.nuevo .dia-col.pasado { background-color: var(--col-pasado); }
.nuevo .dia-col.hoy { background-color: color-mix(in srgb, var(--col) 94%, var(--acento)); }
.nuevo .velo { position: absolute; left: 0; right: 0; top: 0; background: var(--velo); pointer-events: none; }

.nuevo .t { position: absolute; left: 6px; right: 6px; border-radius: 9px; padding: 6px 9px; overflow: hidden; cursor: pointer;
  background: var(--tarjeta); border: 1px solid var(--tarjeta-borde); transition: transform .18s ease, box-shadow .18s ease, border-color .18s; z-index: 2; }
.nuevo .t:hover { transform: translateY(-2px); box-shadow: 0 14px 24px -14px rgba(0,0,0,.6); border-color: var(--acento); z-index: 5; }
.nuevo .t .n { font-family: var(--serif); font-size: 14px; font-weight: 600; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nuevo .t .m { font-size: 11px; color: var(--texto-2); margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nuevo .cuentas { display: flex; gap: 3px; margin-top: 6px; }
.nuevo .cuentas i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--texto-3); }
.nuevo .cuentas i.h { background: var(--acento); border-color: var(--acento); }
.nuevo .cuentas i.a { border-color: var(--acento); box-shadow: 0 0 0 2px color-mix(in srgb, var(--acento) 30%, transparent); }
.nuevo .t.atendido { background: var(--hecho); border-color: transparent; }
.nuevo .t.atendido .n { color: var(--texto-2); font-weight: 400; }
.nuevo .t.atendido .ok { position: absolute; top: 6px; right: 7px; color: var(--salvia); }
.nuevo.dia .t.atendido .ok { color: #5f7a52; }
.nuevo .t.ausente { background: transparent; border: 1px dashed color-mix(in srgb, var(--vino-txt) 70%, transparent); }
.nuevo .t.ausente .n { color: var(--vino-txt); font-weight: 400; text-decoration: line-through; text-decoration-thickness: 1px; }
.nuevo .t.sinficha { border-style: dashed; border-color: var(--texto-3); }
.nuevo .t.sinficha .n { font-style: italic; }
.nuevo .t.proximo { border-color: var(--acento); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acento) 18%, transparent); }
.nuevo .chip { display: inline-block; font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: .04em; color: var(--acento); margin-left: 4px; }

.nuevo .ahora { position: absolute; left: 64px; right: 0; height: 0; border-top: 1.5px solid var(--acento); z-index: 6; pointer-events: none; }
.nuevo .ahora::before { content: ""; position: absolute; top: -5px; width: 9px; height: 9px; border-radius: 50%; background: var(--acento); left: var(--x); box-shadow: 0 0 0 4px color-mix(in srgb, var(--acento) 25%, transparent); }
.nuevo .ahora-et { position: absolute; left: 6px; transform: translateY(-50%); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--acento); color: var(--tinta); border-radius: 5px; padding: 2px 6px; z-index: 7; }
.nuevo.dia .ahora-et { color: #fff; }
.nuevo .ahora-pasado { position: absolute; left: 64px; right: 0; border-top: 1px dashed color-mix(in srgb, var(--acento) 35%, transparent); z-index: 1; pointer-events: none; }

.nuevo .fantasma { position: absolute; left: 6px; right: 6px; height: 54px; border: 1.5px dashed var(--acento); border-radius: 9px; padding: 6px 9px; font-size: 12px; color: var(--acento); pointer-events: none; z-index: 3; display: flex; gap: 6px; align-items: flex-start; background: color-mix(in srgb, var(--acento) 7%, transparent); }
.nuevo .fantasma b { font-variant-numeric: tabular-nums; }

.nuevo .peek { position: absolute; width: 260px; z-index: 9; border-radius: 12px; padding: 14px 16px; background: var(--toolbar); border: 1px solid var(--tarjeta-borde); box-shadow: 0 24px 40px -18px rgba(0,0,0,.7); pointer-events: none; transition: top .15s ease, left .15s ease; }
.nuevo .peek .pn { font-family: var(--serif); font-size: 18px; font-weight: 600; }
.nuevo .peek .ph { font-size: 12px; color: var(--texto-2); margin-top: 2px; font-variant-numeric: tabular-nums; }
.nuevo .peek .serie { margin: 12px 0; padding: 10px 0; border-top: 1px solid var(--linea); border-bottom: 1px solid var(--linea); font-size: 12px; color: var(--texto-2); }
.nuevo .peek .serie strong { color: var(--texto); font-weight: 600; }
.nuevo .peek dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; margin: 0; }
.nuevo .peek dt { color: var(--texto-3); }
.nuevo .peek dd { margin: 0; }
.nuevo .peek .nota { margin-top: 10px; font-family: var(--serif); font-style: italic; font-size: 13px; line-height: 1.45; color: var(--texto-2); }
.nuevo .peek .acc { display: flex; gap: 8px; margin-top: 12px; }
.nuevo .peek .acc span { font-size: 12px; border-radius: 8px; padding: 6px 10px; border: 1px solid var(--tarjeta-borde); }
.nuevo .peek .acc span.p { background: var(--acento); color: var(--tinta); border-color: var(--acento); font-weight: 600; }
.nuevo.dia .peek .acc span.p { color: #fff; }

/* ---------- ACTUAL ---------- */
.viejo { background: #f7f5f2; }
.viejo .barra { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-bottom: 1px solid #e7e5e4; background: rgba(255,255,255,.8); }
.viejo .nav { display: flex; border: 1px solid #e7e5e4; border-radius: 12px; background: #fff; padding: 2px; }
.viejo .nav button { font: inherit; border: 0; background: transparent; color: #78716c; height: 32px; min-width: 32px; border-radius: 8px; font-size: 16px; }
.viejo .nav button.hoy { font-size: 12px; font-weight: 700; padding: 0 12px; }
.viejo .eyebrow { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: #c95343; font-weight: 700; }
.viejo .titulo { font-family: var(--serif); font-size: 18px; font-weight: 600; color: #292524; }
.viejo .leyenda { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #78716c; }
.viejo .leyenda i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.viejo .cab { display: grid; grid-template-columns: 56px repeat(6, minmax(0,1fr)); background: #fff; border-bottom: 1px solid #e7e5e4; }
.viejo .cab-dia { height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-left: 1px solid #e7e5e4; }
.viejo .cab-dia .dn { font-size: 10px; text-transform: uppercase; color: #a8a29e; letter-spacing: .05em; }
.viejo .cab-dia .num { font-size: 14px; font-weight: 600; color: #44403c; min-width: 24px; height: 24px; display: grid; place-items: center; border-radius: 999px; }
.viejo .cab-dia.hoy .num { background: #c95343; color: #fff; }
.viejo .cuerpo { grid-template-columns: 56px repeat(6, minmax(0,1fr)); background: #fff; }
.viejo .canal { position: relative; border-right: 1px solid #e7e5e4; }
.viejo .canal span { position: absolute; right: 4px; font-size: 10px; color: #a8a29e; transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.viejo .dia-col { position: relative; border-left: 1px solid #e7e5e4; background-image: linear-gradient(#f5f5f4 1px, transparent 1px); background-size: 100% 72px; }
.viejo .t { position: absolute; left: 4px; right: 4px; border-radius: 8px; border-left: 4px solid; padding: 4px 8px; font-size: 11px; line-height: 1.25; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.viejo .t .h { font-weight: 600; font-variant-numeric: tabular-nums; }
.viejo .t .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viejo .t.programado, .viejo .t.proximo, .viejo .t.sinficha { background: #eff6ff; border-color: #4f86c6; color: #1e3a8a; }
.viejo .t.atendido { background: #f0fdf4; border-color: #22c55e; color: #14532d; }
.viejo .t.ausente { background: #fffbeb; border-color: #f59e0b; color: #78350f; }
.viejo .ahora { position: absolute; border-top: 2px solid #ef4444; z-index: 4; }

@media (prefers-reduced-motion: reduce) { .nuevo .t, .nuevo .peek { transition: none; } }
@media (max-width: 760px) { .nuevo .resumen { display: none; } }
</style>
</head>
<body>

<div class="switch">
  <div class="seg" role="group" aria-label="Versión">
    <button id="b-viejo" aria-pressed="false">Actual</button>
    <button id="b-nuevo" aria-pressed="true">Propuesta</button>
  </div>
  <div class="seg" role="group" aria-label="Modo" id="modos">
    <button id="b-noche" aria-pressed="true">Noche</button>
    <button id="b-dia" aria-pressed="false">Día</button>
  </div>
</div>

<div class="frame"><div id="app"></div></div>

<script>
const S = 1.2, H0 = 8, H1 = 20, ALTO = (H1 - H0) * 60 * S;
const AHORA = 16 * 60 + 40, HOY = 3;
const DIAS = [["lun",12],["mar",13],["mié",14],["jue",15],["vie",16],["sáb",17]];

const T = [
  [0,"08:00",45,"Lucía Ferreyra","atendido",[4,10],"Lumbalgia"],
  [0,"09:00",45,"Martín Godoy","atendido",[2,8],"Hombro derecho"],
  [0,"10:30",45,"Carla Benítez","ausente",null,"Esguince tobillo"],
  [0,"15:00",45,"Jorge Paz","atendido",[7,10],"Cervicalgia"],
  [0,"17:00",45,"Sofía Ríos","atendido",[1,6],"Post quirúrgico LCA"],
  [1,"08:30",45,"Ramiro Acosta","atendido",[3,10],"Tendinitis rotuliana"],
  [1,"11:00",45,"Paula Quiroga","atendido",[5,8],"Fascitis plantar"],
  [1,"14:00",60,"Elena Suárez","atendido",[9,10],"Artrosis de rodilla"],
  [1,"18:00",45,"Tomás Medina","atendido",[2,6],"Epicondilitis"],
  [2,"09:00",45,"Lucía Ferreyra","atendido",[5,10],"Lumbalgia"],
  [2,"10:00",45,"Hugo Vera","atendido",[5,8],"Hombro congelado"],
  [2,"16:30",45,"Diego Luna","ausente",null,"Contractura dorsal"],
  [2,"19:00",45,"Martina Sosa","atendido",[3,10],"Escoliosis"],
  [3,"08:00",45,"Ana Castro","atendido",[2,10],"Ciática"],
  [3,"09:00",45,"Ramiro Acosta","atendido",[4,10],"Tendinitis rotuliana"],
  [3,"11:30",45,"Hugo Vera","atendido",[6,8],"Hombro congelado"],
  [3,"15:00",45,"Carla Benítez","atendido",[1,6],"Esguince tobillo"],
  [3,"17:00",45,"Elena Suárez","proximo",[10,10],"Artrosis de rodilla"],
  [3,"18:00",45,"Martín Godoy","programado",[3,8],"Hombro derecho"],
  [3,"19:00",45,"Nueva consulta","sinficha",null,"Sin ficha · 351 555-0187"],
  [4,"08:30",45,"Lucía Ferreyra","programado",[6,10],"Lumbalgia"],
  [4,"10:00",45,"Jorge Paz","programado",[8,10],"Cervicalgia"],
  [4,"12:00",45,"Sofía Ríos","programado",[2,6],"Post quirúrgico LCA"],
  [4,"16:00",45,"Paula Quiroga","programado",[6,8],"Fascitis plantar"],
  [4,"17:30",45,"Tomás Medina","programado",[3,6],"Epicondilitis"],
  [5,"09:00",45,"Diego Luna","programado",[1,4],"Contractura dorsal"],
  [5,"10:00",45,"Martina Sosa","programado",[4,10],"Escoliosis"],
];
const FICHAS = {
  "Elena Suárez": ["PAMI","351 555-0142","Mejoró la flexión de rodilla. Sigue con dolor al bajar escaleras."],
  "Martín Godoy": ["OSDE 210","351 555-0110","Rango de abducción en 120°. Sumar banda elástica."],
};
const min = s => +s.slice(0,2) * 60 + +s.slice(3);
const hhmm = m => String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0");
const posY = m => (m - H0*60) * S;
const fin = t => hhmm(min(t[1]) + t[2]);
let version = "nuevo", modo = "noche";

function cuentas(s) {
  if (!s) return "";
  let h = "";
  for (let i = 1; i <= s[1]; i++) h += `<i class="${i < s[0] ? "h" : i === s[0] ? "a" : ""}"></i>`;
  return `<div class="cuentas" aria-label="Sesión ${s[0]} de ${s[1]}">${h}</div>`;
}

function renderNuevo() {
  const porDia = d => T.filter(t => t[0] === d);
  let cab = `<div></div>`;
  DIAS.forEach(([dn, n], d) => {
    const ts = porDia(d), ocup = ts.reduce((a,t) => a + t[2], 0) / ((H1-H0)*60);
    const est = d < HOY ? "pasado" : d === HOY ? "hoy" : "";
    const pend = ts.filter(t => !["atendido","ausente"].includes(t[4])).length;
    const info = d < HOY ? `${ts.length} turnos` : d === HOY ? `${pend} por atender` : `${ts.length} turnos`;
    cab += `<div class="cab-dia ${est}"><div><div class="dn">${dn}</div><div class="num">${n}</div></div>
      <div class="info">${info}<div class="densidad"><i style="width:${Math.round(ocup*100*2.2)}%"></i></div></div></div>`;
  });
  let canal = `<div class="canal" style="height:${ALTO}px">`;
  for (let h = H0 + 1; h < H1; h++) canal += `<span style="top:${posY(h*60)}px">${hhmm(h*60)}</span>`;
  canal += `</div>`;
  let cols = "";
  DIAS.forEach((_, d) => {
    const est = d < HOY ? "pasado" : d === HOY ? "hoy" : "";
    let c = `<div class="dia-col ${est}" data-d="${d}" style="height:${ALTO}px">`;
    if (d === HOY) c += `<div class="velo" style="height:${posY(AHORA)}px"></div>`;
    porDia(d).forEach((t, i) => {
      const prox = t[4] === "proximo" ? `<span class="chip">· en 20 min</span>` : "";
      const ok = t[4] === "atendido" ? `<svg class="ok" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>` : "";
      const meta = t[4] === "ausente" ? `${t[1]} · Ausente` : t[4] === "sinficha" ? `${t[1]} · ${t[6]}` : `${t[1]} · ${t[6]}`;
      c += `<div class="t ${t[4]}" tabindex="0" data-i="${T.indexOf(t)}" style="top:${posY(min(t[1]))+1}px;height:${t[2]*S-3}px">
        ${ok}<div class="n">${t[3]}${prox}</div><div class="m">${meta}</div>${t[4] === "ausente" ? "" : cuentas(t[5])}</div>`;
    });
    c += `</div>`;
    cols += c;
  });
  const x = `calc((100% / 6) * ${HOY} + 3px)`;
  return `<div class="nuevo ${modo === "dia" ? "dia" : ""}">
    <div class="barra">
      <div class="nav"><button aria-label="Semana anterior">‹</button><button class="hoy">HOY</button><button aria-label="Semana siguiente">›</button></div>
      <div><div class="eyebrow">Agenda</div><div class="titulo">12 – 17 de octubre <em>2026</em></div></div>
      <div class="resumen">
        <span><b>27</b> turnos esta semana</span><span><b>2</b> ausentes</span>
        <span><kbd>T</kbd> hoy &nbsp;<kbd>←</kbd><kbd>→</kbd> semana &nbsp;<kbd>N</kbd> nuevo</span>
        <div class="avatar" title="Ezequiel Tosso">ET</div>
      </div>
    </div>
    <div class="cab">${cab}</div>
    <div class="cuerpo" id="cuerpo">${canal}${cols}
      <div class="ahora" style="top:${posY(AHORA)}px;--x:${x}"></div>
      <div class="ahora-et" style="top:${posY(AHORA)}px">${hhmm(AHORA)}</div>
      <div class="fantasma" id="fantasma"><b>+ 14:00</b> Nuevo turno</div>
      <div class="peek" id="peek"></div>
    </div>
  </div>`;
}

function renderViejo() {
  let cab = `<div></div>`;
  DIAS.forEach(([dn, n], d) => cab += `<div class="cab-dia ${d === HOY ? "hoy" : ""}"><span class="dn">${dn}</span><span class="num">${n}</span></div>`);
  let canal = `<div class="canal" style="height:${ALTO}px">`;
  for (let h = H0 + 1; h < H1; h++) canal += `<span style="top:${posY(h*60)}px">${hhmm(h*60)}</span>`;
  canal += `</div>`;
  let cols = "";
  DIAS.forEach((_, d) => {
    let c = `<div class="dia-col" style="height:${ALTO}px">`;
    if (d === HOY) c += `<div class="ahora" style="left:0;right:0;top:${posY(AHORA)}px"></div>`;
    T.filter(t => t[0] === d).forEach(t => {
      c += `<div class="t ${t[4]}" style="top:${posY(min(t[1]))}px;height:${Math.max(t[2]*S,18)}px"><div class="h">${t[1]}</div><div class="n">${t[4] === "sinficha" ? "Sin ficha" : t[3]}</div></div>`;
    });
    cols += c + `</div>`;
  });
  return `<div class="viejo">
    <div class="barra">
      <div class="nav"><button>‹</button><button class="hoy">HOY</button><button>›</button></div>
      <div style="margin-left:8px"><div class="eyebrow">Agenda semanal</div><div class="titulo">12 al 17 de octubre</div></div>
      <div class="leyenda"><i style="background:#4f86c6"></i> Programado <i style="background:#22c55e;margin-left:8px"></i> Atendido</div>
    </div>
    <div class="cab">${cab}</div>
    <div class="cuerpo">${canal}${cols}</div>
  </div>`;
}

function peek(i) {
  const t = T[i], p = document.getElementById("peek"), card = document.querySelector(`.t[data-i="${i}"]`), cuerpo = document.getElementById("cuerpo");
  if (!p || !card) return;
  const f = FICHAS[t[3]] || ["Particular", "351 555-0100", "Sin notas todavía."];
  const serie = t[5] ? (t[5][0] === t[5][1] ? `<strong>Sesión ${t[5][0]} de ${t[5][1]}</strong> · última del tratamiento` : `<strong>Sesión ${t[5][0]} de ${t[5][1]}</strong> · quedan ${t[5][1]-t[5][0]}`) : t[4] === "sinficha" ? "<strong>Sin ficha</strong> · crear paciente al atender" : "Sin tratamiento asignado";
  p.innerHTML = `<div class="pn">${t[3]}</div><div class="ph">${DIAS[t[0]][0]} ${DIAS[t[0]][1]} · ${t[1]}–${fin(t)} · ${t[6]}</div>
    <div class="serie">${serie}${t[5] ? cuentas(t[5]) : ""}</div>
    <dl><dt>Obra social</dt><dd>${f[0]}</dd><dt>Teléfono</dt><dd>${f[1]}</dd></dl>
    <div class="nota">“${f[2]}”</div>
    <div class="acc"><span class="p">Marcar atendido</span><span>Ver historia</span></div>`;
  const cr = card.getBoundingClientRect(), br = cuerpo.getBoundingClientRect();
  let left = cr.right - br.left + 10;
  if (left + 260 > br.width) left = cr.left - br.left - 270;
  p.style.left = left + "px";
  p.style.top = Math.min(Math.max(cr.top - br.top - 80, 8), br.height - p.offsetHeight - 8) + "px";
}

function cablear() {
  if (version !== "nuevo") return;
  const fant = document.getElementById("fantasma"), cuerpo = document.getElementById("cuerpo");
  const ubicar = (col, m) => {
    const cr = col.getBoundingClientRect(), br = cuerpo.getBoundingClientRect();
    fant.style.left = (cr.left - br.left + 6) + "px"; fant.style.width = (cr.width - 12) + "px"; fant.style.right = "auto";
    fant.style.top = posY(m) + "px"; fant.querySelector("b").textContent = "+ " + hhmm(m);
  };
  ubicar(document.querySelector('.dia-col[data-d="4"]'), 14 * 60);
  document.querySelectorAll(".dia-col").forEach(col => {
    col.addEventListener("mousemove", e => {
      if (e.target.closest(".t")) { fant.style.opacity = 0; return; }
      const y = e.clientY - col.getBoundingClientRect().top;
      const m = Math.min(Math.max(Math.round((y / S) / 15) * 15 + H0*60, H0*60), H1*60 - 45);
      fant.style.opacity = 1; ubicar(col, m);
    });
  });
  document.querySelectorAll(".nuevo .t").forEach(c => {
    c.addEventListener("mouseenter", () => peek(+c.dataset.i));
    c.addEventListener("focus", () => peek(+c.dataset.i));
  });
  peek(T.findIndex(t => t[4] === "proximo"));
}

function render() {
  document.getElementById("app").innerHTML = version === "nuevo" ? renderNuevo() : renderViejo();
  document.getElementById("modos").style.visibility = version === "nuevo" ? "visible" : "hidden";
  [["b-viejo", version === "viejo"], ["b-nuevo", version === "nuevo"], ["b-noche", modo === "noche"], ["b-dia", modo === "dia"]]
    .forEach(([id, v]) => document.getElementById(id).setAttribute("aria-pressed", v));
  requestAnimationFrame(cablear);
}
document.getElementById("b-viejo").onclick = () => { version = "viejo"; render(); };
document.getElementById("b-nuevo").onclick = () => { version = "nuevo"; render(); };
document.getElementById("b-noche").onclick = () => { modo = "noche"; render(); };
document.getElementById("b-dia").onclick = () => { modo = "dia"; render(); };
addEventListener("resize", () => version === "nuevo" && cablear());
render();
</script>
</body>
</html>
